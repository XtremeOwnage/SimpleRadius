# A StatefulSet rather than a Deployment: the SQLite file is the whole state, and this pairs each
# replica with its own volume and keeps rollouts from running two pods against the same file.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: simpleradius
  namespace: simpleradius
  labels:
    app.kubernetes.io/name: simpleradius
spec:
  serviceName: simpleradius
  # SQLite allows exactly one writer, and RADIUS state is shared, so this must stay at 1.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: simpleradius
  template:
    metadata:
      labels:
        app.kubernetes.io/name: simpleradius
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654        # $APP_UID in the dotnet/aspnet image
        fsGroup: 1654          # makes the mounted volume writable by that user
      containers:
        - name: simpleradius
          image: simpleradius:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: radius-auth
              containerPort: 1812
              protocol: UDP
            - name: radius-acct
              containerPort: 1813
              protocol: UDP
          envFrom:
            - configMapRef:
                name: simpleradius-config
          startupProbe:
            # Creating the database on first run takes a moment; this covers it without a long liveness delay.
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
